# Longhorn storage network (setting `storage-network` = longhorn/storage-network).
# Longhorn does not notice changes to a NAD that is already in use: to change it, create a new NAD
# under a new name and point the setting at that.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: storage-network
  namespace: longhorn
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp1s0",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.99.0.0/24",
        "range_start": "10.99.0.100",
        "range_end": "10.99.0.200"
      }
    }
