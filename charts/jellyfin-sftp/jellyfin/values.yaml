httpRoute:
  enabled: true
  parentRefs:
    - name: shared-gateway
      namespace: istio-system
  hostnames:
    - ''

persistence:
  config:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false
    storageClass: longhorn
  media:
    accessMode: ReadWriteMany
    annotations:
      argocd.argoproj.io/sync-options: Prune=false
    size: 100Gi
    storageClass: longhorn

# Config PVC is RWO: a rolling update deadlocks when the new pod lands on another node
deploymentStrategy:
  type: Recreate

metrics:
  enabled: true

# Intel UHD 600 (J4105) VAAPI hardware transcoding via Intel GPU Device Plugin
podSecurityContext:
  supplementalGroups:
    - 44   # video group (/dev/dri/card0)
    - 993  # render group (/dev/dri/renderD128)

# Jellyfin has no env/config hook for server settings, so pin them in encoding.xml
# on the config PVC before start. Changes made in the dashboard get overwritten on restart.
# NightmodeDialogue: stereo downmix with boosted dialogue (5.1 content on the LG TV)
extraInitContainers:
  - name: pin-encoding-settings
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - |
        f=/config/config/encoding.xml
        [ -f "$f" ] || exit 0
        sed -i 's|<DownMixStereoAlgorithm>.*</DownMixStereoAlgorithm>|<DownMixStereoAlgorithm>NightmodeDialogue</DownMixStereoAlgorithm>|' "$f"
    volumeMounts:
      - name: config
        mountPath: /config

resources:
  requests:
    cpu: 500m
    memory: 512Mi
    gpu.intel.com/i915: "1"
  limits:
    cpu: 4000m
    memory: 4Gi
    gpu.intel.com/i915: "1"
