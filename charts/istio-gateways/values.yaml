# domain and the public hostnames of public-gateway are passed in from apps/values-private.yaml.
domain: example.org

# Gateway name -> settings. Without hostnames a gateway gets a single wildcard
# listener "*.<domain>"; with hostnames it gets one listener per "<host>.<domain>".
# routeNamespaceLabel: only namespaces with this label set to "true" may attach routes.
gateways:
  public-gateway:
    address: 172.16.4.40
    hostnames: []
    routeNamespaceLabel: public-gateway-access
  internal-gateway:
    address: 172.16.4.41
    hostnames: []
    routeNamespaceLabel: internal-gateway-access
