# Only argocd-server needs to be part of the Istio ambient mesh (for the shared-gateway HTTPRoute
# ingress below). The other components are excluded via podLabels, because Cilium's NetworkPolicy
# identity resolution for pod/namespaceSelector-based ingress rules doesn't work reliably for
# ztunnel-redirected ambient traffic in this cluster, which broke both kubelet health probes and
# server->repo-server gRPC calls after argo-helm chart 10.x turned on NetworkPolicies by default.
configs:
  cm:
    accounts.steled: apiKey, login
    accounts.steled.enabled: true
    admin.enabled: false
    resource.exclusions: |
      ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - Endpoints
        - EndpointSlice
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
    users.anonymous.enabled: false
  params:
    server.insecure: true
  rbac:
    policy.csv: |
      g, steled, role:admin
  repositories:
    argocd-apps:
      url: git@github.com:steled/argocd-apps.git
server:
  httproute:
    enabled: true
    parentRefs:
      - name: shared-gateway
        namespace: istio-system
      - name: internal-gateway
        namespace: istio-system
controller:
  podLabels:
    istio.io/dataplane-mode: none
dex:
  podLabels:
    istio.io/dataplane-mode: none
redis:
  podLabels:
    istio.io/dataplane-mode: none
repoServer:
  podLabels:
    istio.io/dataplane-mode: none
  image:
    repository: ghcr.io/steled/argocd-transcrypt-plugin # argocd-transcrypt-plugin: decrypts transcrypt-encrypted files (values-private.yaml) after git fetch; tag is set in apps/values.yaml (argocd.transcryptPlugin.version)
  env:
    - name: TRANSCRYPT_CIPHER
      valueFrom:
        secretKeyRef:
          name: transcrypt-password
          key: cipher
          optional: true
    - name: TRANSCRYPT_PASSWORD_DIR
      value: /transcrypt-secret
  volumes:
    - name: transcrypt-secret
      secret:
        secretName: transcrypt-password
        defaultMode: 0440 # transcrypt-password secret is created by homelab-terraform (bootstrap)
  volumeMounts:
    - name: transcrypt-secret
      mountPath: /transcrypt-secret
      readOnly: true
applicationSet:
  podLabels:
    istio.io/dataplane-mode: none
notifications:
  podLabels:
    istio.io/dataplane-mode: none
  notifiers:
    service.telegram: |
      token: $telegram-token
global:
  securityContext:
    fsGroup: 999 # makes the transcrypt-password secret readable for the argocd user (UID/GID 999)
