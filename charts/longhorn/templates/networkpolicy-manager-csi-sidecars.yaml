# The upstream longhorn-manager NetworkPolicy (introduced in v1.12.1) already allows all
# ports (including Istio ambient's ztunnel HBONE tunnel port) from its listed peers - it
# just doesn't list the external CSI sidecar Deployments, which are separate from
# longhorn-csi-plugin and therefore get silently blocked once ambient mode routes their
# traffic through the tunnel. NetworkPolicies targeting the same pod are additive, so this
# supplementary policy only needs to add the missing peers, not touch existing rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-csi-sidecars
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: csi-attacher
    - podSelector:
        matchLabels:
          app: csi-provisioner
    - podSelector:
        matchLabels:
          app: csi-resizer
    - podSelector:
        matchLabels:
          app: csi-snapshotter
