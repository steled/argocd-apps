apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: steled-selfsigned-ca
  namespace: cert-manager
spec:
  commonName: steled-selfsigned-ca
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: root-secret
  subject:
    organizations:
      - steled
