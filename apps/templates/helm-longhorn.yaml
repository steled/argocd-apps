apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: helm-longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  destination:
    namespace: longhorn
    server: {{ .Values.spec.destination.server }}
  project: apps
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: {{ .Values.longhorn.version }}
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/charts/longhorn/values.yaml
    - repoURL: git@github.com:steled/argocd-apps.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:steled/argocd-apps.git
      path: ./charts/longhorn
      targetRevision: {{ .Values.spec.source.targetRevision }}
      helm:
        parameters:
          - name: "httproute.hostnames0"
            value: {{ .Values.longhorn.httproute.hostnames0 }}
          - name: "backupCleanup.image"
            value: "alpine/k8s:{{ .Values.longhorn.backupCleanupImage.version }}"
        releaseName: longhorn-addition
        valueFiles:
          - ./values.yaml
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      enabled: true
      prune: true
    managedNamespaceMetadata:
      labels:
        # Longhorn's data path (engine<->replica, NFS recovery backend) must not depend on
        # ztunnel: every ztunnel restart dropped all replica connections cluster-wide, and
        # enrollment races after reboots silently blackholed longhorn-manager
        # (istio/istio#60882). Explicit "none" rather than dropping the label, so the
        # namespace is reliably opted out even if the label were left behind.
        istio.io/dataplane-mode: none
        shared-gateway-access: "true"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
